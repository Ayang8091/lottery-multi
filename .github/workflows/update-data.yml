name: Update lottery data

on:
  schedule:
    # 北京时间 = UTC + 8
    - cron: '50 12 * * 2,5,0'  # 周二/周五/周日 20:50：7星彩
    - cron: '55 12 * * *'      # 每日 20:55：排列3、排列5
    - cron: '35 13 * * 1,3,6'  # 周一/周三/周六 21:35：大乐透
    - cron: '40 13 * * *'      # 每日 21:40：双色球、福彩3D
    - cron: '55 13 * * *'      # 每日 21:55：快乐8
    - cron: '30 14 * * *'      # 每日 22:30：全游戏补抓，防止官方延迟或单次失败
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  update-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Update 7星彩
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '50 12 * * 2,5,0'
        run: node multi/scripts/fetch.js --games=qxc

      - name: Update 排列3 and 排列5
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '55 12 * * *'
        run: node multi/scripts/fetch.js --games=pl3,pl5

      - name: Update 大乐透
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '35 13 * * 1,3,6'
        run: node multi/scripts/fetch.js --games=dlt

      - name: Update 双色球 and 福彩3D
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '40 13 * * *'
        run: node multi/scripts/fetch.js --games=ssq,f3d

      - name: Update 快乐8
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '55 13 * * *'
        run: node multi/scripts/fetch.js --games=kl8

      - name: Update all games as fallback
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '30 14 * * *'
        run: node multi/scripts/fetch.js --games=dlt,qxc,pl3,pl5,ssq,kl8,f3d

      - name: Commit latest data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add multi/data/all.json multi/public/data/all.json
          if git diff --cached --quiet; then
            echo "官方数据没有变化"
          else
            git commit -m "chore: sync official lottery data"
            git push
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./multi/public

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
